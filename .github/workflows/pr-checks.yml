name: PR Checks

# Triggers on pull requests to main branch
on:
  pull_request:
    branches: main

jobs:
  # Native tests (runs on all platforms for maximum compatibility)
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # pioarduino requires Python 3.10-3.13
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini
    
    - name: Run Core Unit Tests
      run: pio test -e native
    
    - name: Run CLI Unit Tests
      run: pio test -e native_cli_test

    # Same core suite as above; what these add is a detector. Plain native runs
    # matchManagerConcurrentDriverVsReader too, but only tsan checks it for races.
    # Run the binary directly: pio's googletest runner echoes only lines it parses
    # as test results, so a sanitizer report never reaches the log, and it renders
    # a non-zero exit as a signal name ("received signal SIGHUP" for exit 1).
    - name: Run Core Unit Tests under AddressSanitizer
      run: |
        pio test -e native_asan --without-testing
        ./.pio/build/native_asan/program

    - name: Run Core Unit Tests under ThreadSanitizer
      run: |
        pio test -e native_tsan --without-testing
        ./.pio/build/native_tsan/program

  # ESP32 build verification
  build-esp32:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # pioarduino requires Python 3.10-3.13
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini
    
    - name: Build ESP32-S3 Release
      run: pio run -e esp32-s3_pdn_release
  
  # Native CLI build verification (Unix only)
  build-cli:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini
    
    - name: Build Native CLI
      run: pio run -e native_cli