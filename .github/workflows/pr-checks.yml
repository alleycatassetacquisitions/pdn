name: PR Checks

# Triggers on pull requests to main branch
on:
  pull_request:
    branches: main

permissions: {}

jobs:
  # Native tests (runs on all platforms for maximum compatibility)
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini

    - name: Verify vendored .proto matches upstream.lock.json
      run: python scripts/sync_proto_upstream.py --check

    - name: Run Core Unit Tests
      run: pio test -e native

    - name: Run CLI Unit Tests
      run: pio test -e native_cli_test

    # Plain native runs matchManagerConcurrentDriverVsReader too, but only tsan
    # checks it for races. These run the built binary directly rather than under
    # `pio test` — see the notes above each sanitizer env in platformio.ini.
    - name: Run Core Unit Tests under AddressSanitizer
      run: |
        pio test -e native_asan --without-testing
        ./.pio/build/native_asan/program

    - name: Run Core Unit Tests under ThreadSanitizer
      run: |
        pio test -e native_tsan --without-testing
        ./.pio/build/native_tsan/program

  # ESP32 build verification
  build-esp32:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio==6.2.0

    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini

    - name: Build ESP32-S3 Release
      run: pio run -e esp32-s3_pdn_release

    # IDF compiles with -Werror. FDN sources build in no other env, and debug's
    # -Og changes which warnings GCC reports, so either can fail on its own.
    - name: Build FDN Release
      run: pio run -e esp32-s3_fdn_release

    - name: Build ESP32-S3 Debug
      run: pio run -e esp32-s3_pdn_debug

  # Native CLI build verification (Unix only)
  build-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini

    - name: Build Native CLI
      run: pio run -e native_cli
