name: PR Checks

# Omit branches filter: it matches the PR base branch and would skip stacked PRs.
on:
  pull_request:

permissions: {}

jobs:
  # Native tests (runs on all platforms for maximum compatibility)
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini

    - name: Run Core Unit Tests
      run: pio test -e native

    - name: Run CLI Unit Tests
      run: pio test -e native_cli_test

    # Plain native runs matchManagerConcurrentDriverVsReader too, but only tsan
    # checks it for races. These run the built binary directly rather than under
    # `pio test` — see the notes above each sanitizer env in platformio.ini.
    - name: Run Core Unit Tests under AddressSanitizer
      run: |
        pio test -e native_asan --without-testing
        ./.pio/build/native_asan/program

    - name: Run Core Unit Tests under ThreadSanitizer
      run: |
        pio test -e native_tsan --without-testing
        ./.pio/build/native_tsan/program

  # ESP32 build verification
  build-esp32:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio==6.2.0

    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini

    - name: Build ESP32-S3 Release
      run: pio run -e esp32-s3_pdn_release

    # IDF compiles with -Werror. FDN sources build in no other env, and debug's
    # -Og changes which warnings GCC reports, so either can fail on its own.
    - name: Build FDN Release
      run: pio run -e esp32-s3_fdn_release

    - name: Build ESP32-S3 Debug
      run: pio run -e esp32-s3_pdn_debug

  # Native CLI build verification (Unix only)
  build-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini

    - name: Build Native CLI
      run: pio run -e native_cli

  style:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        persist-credentials: false
        # --base HEAD^1 needs the merge commit's parents, which the default
        # depth-1 fetch does not include.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    # Pin clang major so clang-format output stays consistent across runner updates.
    - name: Install clang tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-18 clang-tidy-18
        sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
        sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Create WiFi credentials file for CI
      run: |
        cp wifi_credentials.ini.example wifi_credentials.ini
        sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
        sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
        sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini

    - name: Generate compile database
      run: pio run -e native_cli -t compiledb

    # Pass HEAD^1 (the merge commit's base-branch parent), not stale pull_request.base.sha.
    - name: Check style on the pull request diff
      run: python scripts/check_style.py --base HEAD^1 --strict
