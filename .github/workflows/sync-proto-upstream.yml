name: Sync Upstream Proto

on:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [alleycat-rs-proto-updated]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream alleycat-rs ref (branch, tag, or SHA)'
        required: false
        default: 'main'

permissions: {}

jobs:
  sync-proto:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: 'true'
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and protobuf codegen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio "protobuf>=3.19.1" "grpcio-tools>=1.43.0"
          pio pkg install -e native

      - name: Bump upstream lockfile, sync .proto, and regenerate nanopb bindings
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF: ${{ inputs.ref || github.event.client_payload.ref || 'main' }}
        run: |
          OLD_SHA=$(python -c 'import json; print(json.load(open("lib/alleycat-server/proto/upstream.lock.json"))["artifacts"][0]["repository"]["commit"])')
          python scripts/sync_proto_upstream.py --bump="${UPSTREAM_REF}" --generate
          NEW_SHA=$(python -c 'import json; print(json.load(open("lib/alleycat-server/proto/upstream.lock.json"))["artifacts"][0]["repository"]["commit"])')
          echo "old_sha=${OLD_SHA}" >> "$GITHUB_OUTPUT"
          echo "new_sha=${NEW_SHA}" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- lib/alleycat-server/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create WiFi credentials file for CI
        if: steps.sync.outputs.changed == 'true'
        run: |
          cp wifi_credentials.ini.example wifi_credentials.ini
          sed -i 's/YourWiFiSSID/CI_SSID/' wifi_credentials.ini
          sed -i 's/YourWiFiPassword/CI_PASSWORD/' wifi_credentials.ini
          sed -i 's|https://your-api-endpoint.com/api/v1|http://localhost:3000|' wifi_credentials.ini

      - name: Verify regenerated bindings against native unit tests
        id: tests
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: |
          pio test -e native
          pio test -e native_cli_test

      - name: Create or update Pull Request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_SHA: ${{ steps.sync.outputs.old_sha }}
          NEW_SHA: ${{ steps.sync.outputs.new_sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          rm -f wifi_credentials.ini
          SHORT_NEW="${NEW_SHA:0:8}"
          SHORT_OLD="${OLD_SHA:0:8}"
          BRANCH="automation/sync-device-api-proto"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add lib/alleycat-server/
          git commit -m "alleycat-server: sync device_api.proto to alleycat-rs@${SHORT_NEW}"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push --force origin "HEAD:refs/heads/${BRANCH}"

          if [ "${TEST_OUTCOME}" = "success" ]; then
            STATUS_NOTE="Native unit tests (\`pio test -e native\` and \`pio test -e native_cli_test\`) **passed** with the regenerated nanopb bindings."
          else
            STATUS_NOTE="Native unit tests (\`pio test -e native\` / \`pio test -e native_cli_test\`) **failed** after regenerating nanopb bindings — breaking wire changes in \`device_api.proto\` require updating \`lib/alleycat-server/\` codecs or \`device_api.options\`."
          fi

          BODY=$(cat <<EOF
          Automated sync of \`lib/alleycat-server/proto/device_api.proto\` and nanopb bindings from \`alleycatassetacquisitions/alleycat-rs\`.

          - **Previous upstream commit:** \`${OLD_SHA}\`
          - **New upstream commit:** \`${NEW_SHA}\`
          - **Upstream diff:** https://github.com/alleycatassetacquisitions/alleycat-rs/compare/${SHORT_OLD}...${SHORT_NEW}

          ### Verification
          ${STATUS_NOTE}
          EOF
          )

          TITLE="alleycat-server: sync device_api.proto to alleycat-rs@${SHORT_NEW}"
          EXISTING_PR=$(gh pr list --head "${BRANCH}" --base main --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING_PR}" ]; then
            gh pr edit "${EXISTING_PR}" --title "${TITLE}" --body "${BODY}"
          else
            gh pr create --base main --head "${BRANCH}" --title "${TITLE}" --body "${BODY}"
          fi
