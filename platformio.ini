; PlatformIO Project Configuration File

[platformio]
name = "AAA PDN"
default_envs = esp32-s3_pdn_release
extra_configs = wifi_credentials.ini

; ========================================
; ESP32-S3 BUILD ENVIRONMENTS
; ========================================

; Base configuration for PDN ESP32-S3 builds
[env:esp32-s3_base]
; Which device's sources this build selects; src/CMakeLists.txt globs on it.
board_build.cmake_extra_args = -DPDN_DEVICE=pdn
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-n8r8
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = partitions.csv

build_flags =
    '-DWIFI_SSID="${wifi.WIFI_SSID}"'
    '-DWIFI_PASSWORD="${wifi.WIFI_PASSWORD}"'
    '-DBASE_URL="${wifi.BASE_URL}"'

; Library dependencies
lib_deps =
    ArduinoJson@^7.4.2

; Registers the "multi_flash" custom target for flashing multiple boards at once.
; Usage: pio run -e <env> -t multi_flash
; See scripts/multi_flash_target.py and scripts/flash_multi.py for details.
; Pass --erase at runtime via: $env:MULTI_FLASH_ARGS="--erase"; pio run -e <env> -t multi_flash
extra_scripts =
    pre:scripts/firmware_commit_hash.py
    scripts/multi_flash_target.py
custom_multi_flash_args =

; Debug build
[env:esp32-s3_pdn_debug]
extends = env:esp32-s3_base
build_type = debug
build_flags =
    ${env:esp32-s3_base.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=1
debug_tool = esp-builtin
debug_init_break = tbreak loop

; Release build (default)
[env:esp32-s3_pdn_release]
extends = env:esp32-s3_base
build_type = release
build_flags =
    ${env:esp32-s3_base.build_flags}
    -DCORE_DEBUG_LEVEL=2
custom_multi_flash_args = --clear-nvs

; Release with verbose logging
[env:esp32-s3_pdn_release_verbose]
extends = env:esp32-s3_base
build_type = release
build_flags =
    ${env:esp32-s3_base.build_flags}
    -DCORE_DEBUG_LEVEL=5

; ========================================
; FDN ESP32-S3 BUILD ENVIRONMENTS
; ========================================

; Base configuration for FDN ESP32-S3 builds
[env:esp32-s3_fdn_base]
; Identical to the PDN base but for which device's sources CMake globs, so it
; inherits rather than restating: a one-sided edit here used to be able to drop
; the sdkconfig-staleness hook from one family and not the other.
extends = env:esp32-s3_base
board_build.cmake_extra_args = -DPDN_DEVICE=fdn

[env:esp32-s3_fdn_debug]
extends = env:esp32-s3_fdn_base
build_type = debug
build_flags =
    ${env:esp32-s3_fdn_base.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=1
debug_tool = esp-builtin
debug_init_break = tbreak loop

; FDN release build
[env:esp32-s3_fdn_release]
extends = env:esp32-s3_fdn_base
build_type = release
build_flags =
    ${env:esp32-s3_fdn_base.build_flags}
    -DCORE_DEBUG_LEVEL=2
custom_multi_flash_args = --clear-nvs

; FDN release with verbose logging
[env:esp32-s3_fdn_release_verbose]
extends = env:esp32-s3_fdn_base
build_type = release
build_flags =
    ${env:esp32-s3_fdn_base.build_flags}
    -DCORE_DEBUG_LEVEL=5

; ========================================
; NATIVE BUILD ENVIRONMENTS
; ========================================

; Shared desktop (PDN) build settings — same role as esp32-s3_base / esp32-s3_fdn_base
[env:native_base]
platform = native

build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -I src/pdn
    -I src

; PDN-only: exclude firmware entry points, CLI, and FDN device code
build_src_filter =
    +<*>
    -<pdn/main.cpp>
    -<fdn/*>
    -<cli/*>

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
build_unflags = -Werror

[env:native]
extends = env:native_base
build_type = test
test_framework = googletest
test_build_src = yes
test_filter = test_core

; ========================================
; NATIVE TSAN ENVIRONMENT (Thread / race detection)
; ========================================
; Run: pio test -e native_tsan --without-testing && ./.pio/build/native_tsan/program
; Enables ThreadSanitizer. Run the binary yourself: a default `pio test` prints
; only lines its googletest parser recognizes, so a race report is dropped unless
; you pass -v or the case it lands in also fails. TSan exits 66, which pio reports
; as "Program errored with 66 code".

[env:native_tsan]
extends = env:native
build_flags =
    ${env:native_base.build_flags}
    -fsanitize=thread
    -fno-omit-frame-pointer
    -g
    -O1

; ========================================
; NATIVE ASAN ENVIRONMENT (Memory / leak detection)
; ========================================
; Run: pio test -e native_asan --without-testing && ./.pio/build/native_asan/program
; Enables AddressSanitizer + LeakSanitizer. Run the binary yourself: a default
; `pio test` prints only lines its googletest parser recognizes, so an overflow
; report is dropped unless you pass -v or the case it lands in also fails. Leaks
; come out under ASan's exit code, not standalone LSan's 23, so any finding here
; exits 1 — which pio reports as the signal name SIGHUP.

[env:native_asan]
extends = env:native
build_flags =
    ${env:native_base.build_flags}
    -fsanitize=address,leak
    -fno-omit-frame-pointer
    -g
    -O1

; ========================================
; NATIVE PROFILE ENVIRONMENT (CPU profiling via perf)
; ========================================

[env:native_profile]
extends = env:native
build_flags =
    ${env:native_base.build_flags}
    -g
    -O2
    -fno-omit-frame-pointer

; ========================================
; NATIVE PERF ENVIRONMENT (Business-logic duel benchmark)
; ========================================
; Builds a standalone executable with no test framework overhead.
; Uses null-logger and stub drivers so only game logic is hot.
;
; Build:   pio run -e native_perf
; Run:     .pio/build/native_perf/program [NUM_DUELS]
; Profile:
;   valgrind --tool=callgrind --callgrind-out-file=callgrind.out \
;     .pio/build/native_perf/program 50000
;   callgrind_annotate --auto=yes callgrind.out > callgrind_report.txt

[env:native_perf]
extends = env:native_base
build_type = release
build_flags =
    ${env:native_base.build_flags}
    -DPERF_BUILD
    -DCORE_DEBUG_LEVEL=0
    -g
    -O2
    -fno-omit-frame-pointer
build_src_filter =
    +<*>
    -<pdn/main.cpp>
    -<fdn/*>
    -<cli/cli-main.cpp>
    -<cli/native-main.cpp>

; ========================================
; NATIVE CLI ENVIRONMENT (PDN Simulator)
; ========================================
; PLATFORM REQUIREMENT: Unix/POSIX only (Linux, macOS)
; Windows users should use WSL or Git Bash.
; This tool requires POSIX terminal APIs (termios, fcntl).

[env:native_cli]
extends = env:native_base
build_type = release
build_flags =
    ${env:native_base.build_flags}
    -pthread
; PDN simulator: include cli/cli-main.cpp, exclude firmware entry points and FDN code
build_src_filter =
    +<*>
    -<pdn/main.cpp>
    -<fdn/*>
    -<cli/native-main.cpp>
    -<cli/perf-main.cpp>

; ========================================
; NATIVE CLI TEST ENVIRONMENT
; ========================================
; Tests for CLI components (without the actual terminal UI)

[env:native_cli_test]
extends = env:native_base
build_type = test
test_framework = googletest
test_build_src = yes
test_filter = test_cli
build_flags =
    ${env:native_base.build_flags}
    -pthread
